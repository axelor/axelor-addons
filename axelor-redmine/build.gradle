apply plugin:"com.axelor.app"

apply from: "../libs.gradle"
apply from: "../version.gradle"

apply {
	version = addonsVersion
}

axelor {
	title "Axelor :: Redmine"
	description "Axelor Redmine Module"
}

dependencies {
  if (findProject(":modules:axelor-business-support") != null) {
	  api project(":modules:axelor-business-support")
  }else {
	  api "com.axelor.apps.enterprise:axelor-business-support:8.5.2"
  }

  if (findProject(":modules:axelor-business-production") != null) {
	  api project(":modules:axelor-business-production")
  }else {
	  api "com.axelor.apps.enterprise:axelor-business-production:8.5.2"
  }

	implementation libs.commons_lang3
	implementation libs.json
	implementation libs.java_textile
	
	implementation fileTree(dir: 'libs', include: ['*.jar'])
	implementation 'com.squareup.okhttp3:okhttp:3.14.1'
}
